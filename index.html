<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>RetroBall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="640" height="360" tabindex="0"></canvas>

    <button id="pause-btn" type="button" aria-label="Pause" aria-expanded="false" aria-controls="menu">
      <span></span><span></span>
    </button>

    <div id="menu" role="dialog" aria-label="Pause menu" hidden>
      <div class="menu-head tabs" role="tablist" aria-label="Pause menu sections">
        <button type="button" class="tab" role="tab" data-panel="player-view" aria-selected="true">Player</button>
        <button type="button" class="tab" role="tab" data-panel="upgrade-view" aria-selected="false">Upgrades</button>
        <button type="button" class="tab" role="tab" data-panel="mode-view" aria-selected="false">Mode</button>
        <button type="button" class="tab" role="tab" data-panel="test-view" aria-selected="false">Test</button>
      </div>

      <div class="menu-body tab-panel" id="player-view" role="tabpanel">
        <canvas id="preview" width="80" height="92" aria-label="Player preview"></canvas>

        <div class="controls">
          <div class="row">
            <label for="skin">Skin</label>
            <input type="color" id="skin" data-key="skin">
            <input class="hex" data-key="skin" maxlength="7" spellcheck="false" aria-label="Skin hex">
          </div>
          <div class="row presets" id="skin-presets">
            <span class="label preset-label">Recommended</span>
          </div>
          <div class="row">
            <span class="label">Hair style</span>
            <button type="button" class="step" data-step="-1" aria-label="Previous hair style">&lt;</button>
            <span class="value" id="hair-style-name"></span>
            <button type="button" class="step" data-step="1" aria-label="Next hair style">&gt;</button>
          </div>
          <div class="row">
            <label for="hair">Hair</label>
            <input type="color" id="hair" data-key="hair">
            <input class="hex" data-key="hair" maxlength="7" spellcheck="false" aria-label="Hair hex">
          </div>
          <div class="row">
            <label for="jersey">Jersey</label>
            <input type="color" id="jersey" data-key="jersey">
            <input class="hex" data-key="jersey" maxlength="7" spellcheck="false" aria-label="Jersey hex">
          </div>
          <div class="row">
            <label for="shorts">Shorts</label>
            <input type="color" id="shorts" data-key="shorts">
            <input class="hex" data-key="shorts" maxlength="7" spellcheck="false" aria-label="Shorts hex">
          </div>
          <div class="row">
            <label for="number">Number</label>
            <input id="number" class="num" inputmode="numeric" maxlength="2" autocomplete="off">
          </div>
          <div class="row">
            <label for="shoe">Shoes</label>
            <input type="color" id="shoe" data-key="shoe">
            <input class="hex" data-key="shoe" maxlength="7" spellcheck="false" aria-label="Shoes hex">
          </div>
          <div class="row">
            <label for="laces">Laces</label>
            <input type="color" id="laces" data-key="laces">
            <input class="hex" data-key="laces" maxlength="7" spellcheck="false" aria-label="Laces hex">
          </div>
        </div>
      </div>

      <!-- Upgrades for the user's own player. Free to set for now; saved between visits. -->
      <div class="tab-panel stack-view" id="upgrade-view" role="tabpanel" hidden>
        <p class="test-note">Upgrades for your player (free while testing). In 3v3 every AI player gets the same number of levels, at random.</p>
        <div class="row upgrade" data-upgrade="speed">
          <span class="label">Speed</span>
          <button type="button" class="step" data-delta="-1" aria-label="Lower speed">-</button>
          <span class="pips" aria-hidden="true"></span>
          <button type="button" class="step" data-delta="1" aria-label="Raise speed">+</button>
          <span class="upgrade-effect"></span>
        </div>
        <div class="row upgrade" data-upgrade="shooting">
          <span class="label">Shooting</span>
          <button type="button" class="step" data-delta="-1" aria-label="Lower shooting">-</button>
          <span class="pips" aria-hidden="true"></span>
          <button type="button" class="step" data-delta="1" aria-label="Raise shooting">+</button>
          <span class="upgrade-effect"></span>
        </div>
        <div class="row upgrade" data-upgrade="dunking">
          <span class="label">Dunking</span>
          <button type="button" class="step" data-delta="-1" aria-label="Lower dunking">-</button>
          <span class="pips" aria-hidden="true"></span>
          <button type="button" class="step" data-delta="1" aria-label="Raise dunking">+</button>
          <span class="upgrade-effect"></span>
        </div>
        <div class="row upgrade" data-upgrade="defense">
          <span class="label">Defense</span>
          <button type="button" class="step" data-delta="-1" aria-label="Lower defense">-</button>
          <span class="pips" aria-hidden="true"></span>
          <button type="button" class="step" data-delta="1" aria-label="Raise defense">+</button>
          <span class="upgrade-effect"></span>
        </div>
      </div>

      <!-- Game mode. Switching starts a new game. -->
      <div class="tab-panel stack-view" id="mode-view" role="tabpanel" hidden>
        <p class="test-note">Game mode (switching starts a new game)</p>
        <button type="button" class="mode-option" data-mode="3v3" aria-pressed="false">
          <span class="mode-name">3v3 Casual</span>
          <span class="mode-desc">Full court with AI teammates and opponents</span>
        </button>
        <button type="button" class="mode-option" data-mode="free" aria-pressed="false">
          <span class="mode-name">Free shot</span>
          <span class="mode-desc">Just you and the ball, either hoop</span>
        </button>
      </div>

      <!-- Testing: dunk outcome odds, AI level and crowd density. Not saved; a reload restores the defaults. -->
      <div class="tab-panel stack-view" id="test-view" role="tabpanel" hidden>
        <p class="test-note">Dunk odds</p>
        <div class="row">
          <label for="hang-chance">Rim hang</label>
          <input type="range" id="hang-chance" min="0" max="100" step="1" data-odds="hangChance">
          <span class="value pct" id="hang-chance-value"></span>
        </div>
        <div class="row">
          <label for="shatter-chance">Shatter</label>
          <input type="range" id="shatter-chance" min="0" max="100" step="1" data-odds="shatterChance">
          <span class="value pct" id="shatter-chance-value"></span>
        </div>
        <div class="row">
          <span class="label">Normal</span>
          <span class="slider-spacer"></span>
          <span class="value pct" id="normal-chance-value"></span>
        </div>
        <p class="test-note">AI</p>
        <div class="row">
          <label for="ai-level">AI level</label>
          <input type="range" id="ai-level" min="0" max="100" step="1">
          <span class="value pct" id="ai-level-value"></span>
        </div>
        <p class="test-note">Arena</p>
        <div class="row">
          <label for="crowd-density">Crowd</label>
          <input type="range" id="crowd-density" min="0" max="100" step="1">
          <span class="value pct" id="crowd-density-value"></span>
        </div>
      </div>

      <div class="menu-foot">
        <span class="foot-left">
          <button type="button" class="btn btn-quiet" id="reset-look" data-for="player-view">Reset look</button>
          <button type="button" class="btn btn-quiet" id="reset-upgrades" data-for="upgrade-view" hidden>Reset</button>
          <button type="button" class="btn btn-quiet" id="reset-odds" data-for="test-view" hidden>Defaults</button>
        </span>
        <button type="button" class="btn" id="resume">Resume</button>
      </div>
    </div>
  </div>

  <!-- Plain scripts (not modules) so the game runs straight from file:// as well as any web host. Order matters. -->
  <script src="src/config.js"></script>
  <script src="src/font.js"></script>
  <script src="src/sprite.js"></script>
  <script src="src/input.js"></script>
  <script src="src/camera.js"></script>
  <script src="src/court.js"></script>
  <script src="src/hoop.js"></script>
  <script src="src/debris.js"></script>
  <script src="src/bench.js"></script>
  <script src="src/scoreboard.js"></script>
  <script src="src/player.js"></script>
  <script src="src/team.js"></script>
  <script src="src/ball.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/shooting.js"></script>
  <script src="src/play.js"></script>
  <script src="src/ai.js"></script>
  <script src="src/menu.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
